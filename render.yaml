services:
  # 1. Django REST Backend API (Docker Container)
  - type: web
    name: aethera-carbon-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"

  # 2. React Vite Frontend (Static Hosting)
  - type: web
    name: aethera-carbon-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aethera-carbon-backend.onrender.com

